syntax = "proto2";
enum CardAttribute {
    AttrTapped = 1;
    AttrAttacking = 2;
    AttrFaceDown = 3;
    AttrColor = 4;
    AttrPT = 5;
    AttrAnnotation = 6;
    AttrDoesntUntap = 7;
    // Phase 8 combat automation: which attacking creature (by owner+card id, packed as
    // "playerId:cardId") this creature is declared as blocking; "-1:-1" clears it.
    AttrBlocking = 8;
    // Phase 8 combat automation: which opposing player an attacking creature is attacking; the
    // player id as a string, "-1" clears it.
    AttrAttackTarget = 9;
    // Phase 8 combat automation, Stage C: the creature's recognized evergreen keywords
    // (CardKeywords::parse(), comma-joined), synced by the client from its local card database when
    // the card enters play. Combat math currently only consumes Deathtouch/Trample/Indestructible;
    // the rest ride along unused for future stages.
    AttrKeywords = 10;
    // Static/continuous ability slice: this card's own printed static abilities (P/T boosts and
    // keyword grants applying to "creatures you control"/"other creatures you control"), synced by
    // the client the same way AttrKeywords is. See StaticAbilities::serialize() and
    // doc/commander-status/phase8-static-abilities.md. Server-only consumer today (combat math) --
    // no client display change.
    AttrStaticAbilities = 11;
    // Static/continuous ability slice, client-display extension: the server-computed "P/T after
    // folding in anthem/lord static effects and +1/+1 counters" for this creature, as a plain
    // "power/toughness" string -- server-originated only (no client ever sends this via
    // Command_SetCardAttr). Equal to AttrPT's current value when nothing is currently boosting the
    // creature. See Server_Game::recomputeEffectivePT() and
    // doc/commander-status/phase8-static-abilities.md's "client display" section.
    AttrEffectivePT = 12;
}
