syntax = "proto2";
import "game_commands.proto";

// Phase 7 Stage 2 (targeting) of the card-ability execution engine -- see
// COMMANDER_IMPLEMENTATION_STATUS.md. Deliberately single-purpose ("deal N damage to a resolved
// target"), not a generic "any targeted effect" message, matching this fork's existing precedent
// of narrow protocol additions (e.g. Command_PassPriority). card_id is only unique within one
// player's zone, never globally, so the target must be addressed by the explicit
// (target_player_id, target_zone, target_card_id) triple below rather than an id alone -- same
// convention Command_MoveCard/Command_CreateArrow already use for cross-player addressing.
message Command_ActivateTargetedEffect {
    extend GameCommand {
        optional Command_ActivateTargetedEffect ext = 1036;
    }
    optional sint32 amount = 1;
    optional sint32 target_player_id = 2 [default = -1];
    optional string target_zone = 3;      // absent => target is target_player_id themselves
    optional sint32 target_card_id = 4 [default = -1]; // present only if target_zone is present
}
